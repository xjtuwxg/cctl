[project]
name = "cctl"
version = "2.0.0"
description = "Chameleon Cloud control: leases, bare-metal servers, hardware search, SSH helpers. Agent friendly (--json)."
requires-python = ">=3.11"
dependencies = [
    "openstacksdk>=4.0",
    "python-blazarclient>=4.0",
    "requests>=2.31",
]

[project.scripts]
cctl = "cctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctl"]
